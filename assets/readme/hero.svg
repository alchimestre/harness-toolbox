    <text x="56" y="170" font-size="70" font-weight="700" fill="#e6edf3">harness-toolbox</text>
    <text x="56" y="214" font-size="24" fill="#c9d1d9">Keeps parallel subagents within machine limits.</text>

    <rect x="56" y="248" width="170" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
