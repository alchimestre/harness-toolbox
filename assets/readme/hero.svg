<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">harness-toolbox</title>
  <desc id="desc">Subagents queue for slots in the subagent scheduler, and the model roles they run on: Opus, Haiku, Sonnet and OpenAI.</desc>

  <rect width="1200" height="420" rx="24" fill="#0d1117"/>

